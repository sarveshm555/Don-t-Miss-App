# Render Blueprint Specification for Don't Miss Assistant
services:
  - type: web
    name: dont-miss-backend
    env: python
    region: oregon
    plan: free
    branch: main
    buildCommand: "pip install -r agent/requirements.txt"
    startCommand: "uvicorn agent.app:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_WHATSAPP_NUMBER
        sync: false
